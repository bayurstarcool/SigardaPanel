# Builds, signs and publishes a release.
#
# Two ways to start it:
#   - push a vX.Y.Z tag that points at a commit on main, or
#   - run the workflow manually (Actions -> Release -> Run workflow) on main
#     with the version (e.g. 1.7.0); the release and its tag are created on
#     the current main commit.
#
# Setup (once, repository Settings):
#   - Environments -> "release": add the secrets below and, recommended,
#     required reviewers. If you restrict "Deployment branches and tags",
#     allow the branch main (manual runs) and tags matching v*.*.*.
#   - MINISIGN_SECRET_KEY: the full contents of the minisign secret key file
#     (the key whose public half is PUBKEY in installer/install.sh).
#   - MINISIGN_PASSWORD: the key's password (omit for an unencrypted key).
#
# Release notes are read from docs/releases/vX.Y.Z.md on main.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.7.0 (run on main)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'bayurstarcool/SigardaPanel'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release (and, for manual runs, its tag)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] \
              || { echo "::error::run the workflow on main (got $GITHUB_REF)"; exit 1; }
            v="${INPUT_VERSION#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::version must look like 1.2.3"; exit 1; }
            tag="v$v"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag already exists"; exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: The release commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${TAG} is not on main"; exit 1; }

      - name: The release must not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release ${TAG} already exists"; exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: Build, sign and publish
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPO: ${{ github.repository }}
          # The release (and a missing tag) is created on exactly this commit.
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY is not set"; exit 1; }
          # Only the key file is private: a umask for the whole step made the
          # web bundle and binaries owner-only (v1.7.0 shipped unreadable files).
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          chmod 700 "$keydir"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keydir/sigardapanel.key")
          MINISIGN_KEY="$keydir/sigardapanel.key" OUT="$RUNNER_TEMP/release-dist" \
            bash scripts/release.sh "${TAG#v}" --publish
