# Builds, signs and publishes a release when a vX.Y.Z tag is pushed.
#
# Setup (once, repository Settings):
#   - Environments -> "release": add the secrets below and, recommended,
#     required reviewers and a "Deployment branches and tags" rule limited
#     to tags matching v*.*.* so only approved runs can use the key.
#   - MINISIGN_SECRET_KEY: the full contents of the minisign secret key file
#     (the key whose public half is PUBKEY in installer/install.sh).
#   - MINISIGN_PASSWORD: the key's password (omit for an unencrypted key).
#
# Release: put the notes in docs/releases/vX.Y.Z.md on main, then
#   git tag vX.Y.Z <commit on main> && git push origin vX.Y.Z
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'bayurstarcool/SigardaPanel'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1; }

      - name: The release must not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release ${GITHUB_REF_NAME} already exists"; exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: Build, sign and publish
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          PUBLIC_REPO: ${{ github.repository }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY is not set"; exit 1; }
          umask 077
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keydir/sigardapanel.key"
          MINISIGN_KEY="$keydir/sigardapanel.key" OUT="$RUNNER_TEMP/release-dist" \
            bash scripts/release.sh "${GITHUB_REF_NAME#v}" --publish
