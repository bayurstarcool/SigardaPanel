# Include inside panel.sigarda.dev server block.
# /pma/ticket and /pma/t/ must keep existing SvelteKit proxy settings.

location /pma/ticket {
    proxy_pass http://127.0.0.1:7720;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/pma/t/ {
    proxy_pass http://127.0.0.1:7720;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /pma/ {
    auth_request /pma-auth;
    auth_request_set $pma_authorization $upstream_http_x_pma_authorization;
    error_page 401 = @pma_login;

    # Sigarda marker only decorates browser URL. phpMyAdmin owns its own `token`
    # query parameter for CSRF, so never forward our sg_<sha256> marker upstream.
    if ($arg_token ~ "^sg_[A-Za-z0-9_-]{43}$") {
        set $args "";
    }

    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host localhost;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $pma_authorization;
    proxy_buffering off;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /pma {
    return 302 /pma/;
}

location = /pma-auth {
    internal;
    proxy_pass http://127.0.0.1:7720/api/pma-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location @pma_login {
    return 302 https://$host/login?redirect=/pma/;
}
